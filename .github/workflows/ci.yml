name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Run static checks and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pygooglenews depends on feedparser 5.x, which still needs setuptools' legacy use_2to3 support.
          pip install "setuptools<58" wheel
          # 전이 의존성까지 고정한 락으로 설치합니다. 무핀 설치는 신규 릴리스로 파이프라인이
          # 깨진 이력이 있습니다(googlenewsdecoder 0.2.1, selectolax 1.0.0).
          pip install --no-build-isolation -r requirements.lock.txt

      - name: Install development dependencies
        run: pip install -r requirements-dev.lock.txt

      - name: Run Ruff
        run: ruff check .

      - name: Run mypy
        run: mypy .

      - name: Run unit tests
        run: python -m unittest discover -s tests
